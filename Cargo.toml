[package]
name = "osslscope"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Non-interposing OpenSSL observer on eBPF uprobes"
publish = false

[lib]
name = "osslscope"
path = "src/lib.rs"

[[bin]]
name = "osslscope"
path = "src/main.rs"

[[bin]]
name = "osslscope-dev-admission"
path = "src/bin/osslscope-dev-admission.rs"

[dependencies]
anyhow = "1"
aya = "=0.14.0"
goblin = "0.10"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
ossl-bpf-sys = { path = "crates/bpf-sys" }
osslscope-ebpf-common = { path = "crates/ebpf-common", features = ["user"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }

[dev-dependencies]
aya-obj = "=0.3.0"
# T02: protocol tests decode the discovery wire ABI directly.
osslscope-ebpf-common = { path = "crates/ebpf-common" }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"

[workspace]
members = ["crates/ossl-discover", "crates/manifest", "crates/ebpf-common", "crates/bpf-sys", "crates/bpf-contract"]
# crates/ebpf is deliberately NOT a member: own [workspace] + nightly
# toolchain so the bpf-target no_std bin never enters a host build
# (p11scope Task-3 precedent: workspace membership breaks cargo test).
exclude = ["crates/ebpf", "spike"]

[[test]]
name = "lifecycle_producer_host"
path = "tests/lifecycle_producer_host.rs"
harness = false
