[package]
name = "osslscope"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Non-interposing OpenSSL observer on eBPF uprobes"
publish = false

[lib]
name = "osslscope"
path = "src/lib.rs"

[[bin]]
name = "osslscope"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aya = "=0.14.0"
goblin = "0.10"
ossl-bpf-sys = { path = "crates/bpf-sys" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"

[dev-dependencies]
aya-obj = "=0.3.0"

[workspace]
members = ["crates/ossl-discover", "crates/manifest", "crates/ebpf-common", "crates/bpf-sys"]
# crates/ebpf is deliberately NOT a member: own [workspace] + nightly
# toolchain so the bpf-target no_std bin never enters a host build
# (p11scope Task-3 precedent: workspace membership breaks cargo test).
exclude = ["crates/ebpf", "spike"]
