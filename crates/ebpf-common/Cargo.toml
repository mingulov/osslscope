[package]
name = "osslscope-ebpf-common"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Shared eBPF/user key + event structs (P2 owns content)"
publish = false

[lib]
name = "osslscope_ebpf_common"
path = "src/lib.rs"

[dependencies]
aya = { version = "=0.14.0", optional = true }

[features]
user = ["dep:aya"]
