[package]
name = "osslscope-ebpf"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aya-ebpf = "=0.2.1"
osslscope-ebpf-common = { path = "../ebpf-common" }

[[bin]]
name = "osslscope-ebpf"
path = "src/main.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[workspace]

[[bin]]
name = "osslscope-harvest"
path = "src/bin/harvest.rs"

[[bin]]
name = "osslscope-count"
path = "src/bin/count.rs"
