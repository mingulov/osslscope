name: check
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo check --workspace --locked
      # Whole-schema Rust integration controls use the established Python
      # validator; keep its environment outside the source tree.
      - run: |
          python3 -m venv "$RUNNER_TEMP/osslscope-schema"
          "$RUNNER_TEMP/osslscope-schema/bin/python" -m pip install jsonschema==4.19.2
          echo "$RUNNER_TEMP/osslscope-schema/bin" >> "$GITHUB_PATH"
      # Existing host-fixture inputs: isolated owned paths, serial fd controls,
      # and the exact compiler-artifact driver from this source build.
      - name: Prepare host regression inputs
        run: |
          mkdir -m 700 "$RUNNER_TEMP/osslscope-test-tmp" "$RUNNER_TEMP/osslscope-package-fixtures"
          cargo test --locked --test lifecycle_producer_host --no-run --message-format=json > "$RUNNER_TEMP/osslscope-driver.jsonl"
          python3 - <<'PY'
          import json, os
          root = os.environ["RUNNER_TEMP"]
          artifacts = [r["executable"] for line in open(root + "/osslscope-driver.jsonl") if (r := json.loads(line)).get("reason") == "compiler-artifact" and r["target"]["name"] == "lifecycle_producer_host" and r.get("executable")]
          assert len(artifacts) == 1
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("TMPDIR=" + root + "/osslscope-test-tmp\n")
              output.write("OSSL_PACKAGE_TEST_PRIVATE_DIR=" + root + "/osslscope-package-fixtures\n")
              output.write("OSSL_LIFECYCLE_TEST_DRIVER=" + artifacts[0] + "\nRUST_TEST_THREADS=1\n")
          PY
      - name: Run workspace tests without inherited runner descriptors
        # The pre-thread lifecycle driver rejects unexpected open FDs. Keep
        # runner-owned handles outside Cargo; test-created descriptor controls
        # and the production bootstrap checks remain unchanged.
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(["cargo", "test", "--workspace", "--locked"], check=True, close_fds=True)
          PY
      - run: cargo clippy --workspace --locked -- -D warnings
  bpf:
    # Detached BPF build (T05): crates/ebpf is its own workspace on a pinned
    # nightly and never enters the host workspace build. Compilation only —
    # loader/ABI behavior needs an authorized privileged lane, never CI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-20
          components: rust-src
      - run: cargo install bpf-linker --locked --version 0.10.4
      - run: cd crates/ebpf && cargo +nightly-2026-05-20 build --locked -Z build-std=core --target bpfel-unknown-none --release --bin osslscope-harvest --bin osslscope-count --bin osslscope-members
      - run: file crates/ebpf/target/bpfel-unknown-none/release/osslscope-harvest crates/ebpf/target/bpfel-unknown-none/release/osslscope-count crates/ebpf/target/bpfel-unknown-none/release/osslscope-members
      - run: ./scripts/tests/test-ebpf-build-warnings.sh
      # Members-shape gate (G04): the pure shape suite runs in required
      # mode against this job's freshly built members object — a missing
      # object fails, never a silent skip. Compilation/shape success is
      # still not verifier or live qualification.
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: OSSL_MEMBERS_REQUIRED=1 OSSL_MEMBERS_OBJECT=crates/ebpf/target/bpfel-unknown-none/release/osslscope-members cargo +1.88.0 test --locked --test members_shape -- --nocapture
  packaging:
    # Host-runnable lifecycle/install simulation: deb/rpm scriptlet argument
    # matrix (stub setcap, no root) + local-prefix install layout and
    # diagnostics. Seconds, no toolchain. Real package builds and the
    # privileged guest lifecycle stay in packaging/tests/guest-lifecycle.sh
    # (approved lane only, NOT-RUN here).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./packaging/tests/test-scriptlets.sh
      - run: ./packaging/tests/test-lifecycle-assert.sh
      - run: ./scripts/tests/test-install-dev.sh
      - run: ./scripts/tests/test-live-oracle.sh
      - run: ./scripts/tests/test-live-workflow.sh
      - run: python3 -c "import yaml,sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" .github/workflows/check.yml .github/workflows/live-known-n.yml
  live-gates:
    # Labeled skips, never passes: every live suite needs a privileged BPF
    # lane. The dispatch-only live-known-n workflow holds the owned-runner
    # doctor→check run and stays NOT-RUN until that lane exists. CI has no
    # such capability, so each suite below is an explicit SKIP. A green CI
    # run therefore means host+BPF compile plus host tests only — never a
    # live observation pass.
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for s in core privacy identity lifecycle ordinary installed rate; do
            echo "SKIP(live-capability): suite $s requires a privileged BPF lane; not run in CI"
          done
          echo "SKIP(live-capability): live-known-n workflow is dispatch-only on an owned runner (lane pending)"
  # The former hosted-24.04 doctor beachhead exercised the broader discovery
  # route on an unenrolled kernel. It is not a v0.2 release prerequisite.
  # Qualify the installed count-only app on its exact enrolled host separately.
