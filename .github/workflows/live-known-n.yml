# SPDX-License-Identifier: GPL-3.0-or-later
# live-known-n: bounded live doctor→check with an independent count ledger.
#
# Status: IMPLEMENTED, NOT-RUN (owned BPF lane pending). This workflow only
# runs via workflow_dispatch on a self-hosted runner labeled `osslscope-bpf`
# (x86-64, kernel >= 6.9, BPF-capable, passwordless sudo for the one-time
# setcap). No such runner is registered yet; ordinary PR checks in
# check.yml never touch this file's live steps.
#
# The run is bounded (job timeout 30 min, duration/timeout/grace flags) and
# uses the in-tree ordinary_ops_driver fixture: the workload's own stdout,
# captured via --workload-out to known-n-workload.log, carries the LEDGER
# lines that feed the independent oracle (scripts/live-oracle.py,
# unit-tested on the host), and the observer's v2 JSON must show the
# ledgered operation as >=1 executed site with a matching candidate op
# id — a lower bound, since exact provider-internal callback counts are
# implementation-defined per the fixture contract (recorded, never
# asserted). Observer diagnostics stay in known-n-driver.log and are never
# oracle input; the earlier fixture smoke (driver-smoke.txt) is not ledger
# evidence either. The capability probe consumes doctor --format json plus
# its process status: only allowlisted capability absences
# (caps/kernel/lockdown/lsm) are a labeled SKIP, while artifact
# incompatibility, malformed reports and abnormal exits are setup
# failures, never skips. A missing live capability is a labeled SKIP in
# the job summary, never "capture passed"; a setup failure is reported as
# setup failure, never as a capability skip. A skip is not a passing
# qualification window: required-runner qualification counts admitted
# windows only.
name: live-known-n
on:
  workflow_dispatch:
    inputs:
      product_ref:
        description: "Clean committed product revision to observe (full SHA)"
        required: true
        default: ""
      driver_mode:
        description: "ordinary_ops_driver mode (ecdsa|keyexch|kdf|kem|md4|mixed)"
        required: false
        default: "ecdsa"
run-name: "live-known-n ${{ inputs.product_ref }} mode=${{ inputs.driver_mode }}"
concurrency:
  group: live-known-n
  cancel-in-progress: false
jobs:
  known-n:
    runs-on: [self-hosted, linux, X64, osslscope-bpf]
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Validate driver mode (allowlist, no shell interpolation)
        id: mode
        env:
          MODE_INPUT: ${{ inputs.driver_mode }}
        run: |
          set -eu
          case "$MODE_INPUT" in
            ecdsa|keyexch|kdf|kem|md4|mixed) ;;
            *) echo "bad driver_mode: $MODE_INPUT" >&2; exit 2 ;;
          esac
          echo "mode=$MODE_INPUT" >>"$GITHUB_OUTPUT"
      - name: Check out product ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.product_ref }}
      - name: Record revision (must be clean)
        id: rev
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          test -z "$(git status --porcelain)" || { echo "tree is dirty; refusing live run"; exit 1; }
          git rev-parse HEAD >product-ref.txt
          uname -r >kernel.txt
          cat product-ref.txt kernel.txt
          {
            echo "run: ${GITHUB_RUN_ID:-unknown}/${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "mode: $MODE"
            echo "product: $(cat product-ref.txt)"
            echo "kernel: $(cat kernel.txt)"
          } >invocation.txt
          cat invocation.txt
      - name: Build host + BPF (locked, bounded jobs)
        run: |
          set -eu
          ./scripts/build-dev.sh
      - name: Install to run prefix
        run: |
          set -eu
          ./scripts/install-dev.sh --prefix "${RUNNER_TEMP}/ossl-pfx"
          "${RUNNER_TEMP}/ossl-pfx/bin/osslscope" --help | head -5
      - name: One-time file caps
        run: |
          set -eu
          sudo setcap cap_bpf,cap_perfmon+ep "${RUNNER_TEMP}/ossl-pfx/bin/osslscope"
          getcap "${RUNNER_TEMP}/ossl-pfx/bin/osslscope"
      - name: Build ledger driver fixture
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          cc -O1 -o "${RUNNER_TEMP}/ordinary_ops_driver" \
            crates/ossl-discover/tests/fixture/ordinary_ops_driver.c -lcrypto
          "${RUNNER_TEMP}/ordinary_ops_driver" "$MODE" >driver-smoke.txt 2>&1
          cat driver-smoke.txt
          grep -q ORDDONE driver-smoke.txt
      - name: Probe live capability (doctor)
        id: probe
        run: |
          set -eu
          PFX="${RUNNER_TEMP}/ossl-pfx"
          # User-owned prefix objects are never implicitly trusted: probe
          # with the same explicit flags the check step uses, or a capable
          # runner misclassifies as a capability skip on objects rows.
          # Typed disposition (F13): the JSON report plus the process
          # status decide. Only allowlisted capability absences skip;
          # artifact incompatibility, malformed reports and abnormal
          # exits are setup failures, never skips.
          rc=0
          "$PFX/bin/osslscope" doctor \
            --object "$PFX/lib/osslscope/osslscope-harvest" \
            --count-object "$PFX/lib/osslscope/osslscope-count" \
            --format json \
            >doctor.json 2>doctor.stderr || rc=$?
          echo "$rc" >doctor-rc.txt
          cat doctor.json 2>/dev/null || true
          cat doctor.stderr 2>/dev/null || true
          # BEGIN DOCTOR-DISPOSITION (executed verbatim by scripts/tests/test-live-workflow.sh)
          python3 - "$rc" doctor.json <<'PYEOF'
          import json
          import os
          import sys

          # Allowlisted capability absences: the runner lacks live BPF
          # capability (privilege, kernel features, lockdown, LSM
          # denial). Every other failing check (objects-*, spawn-access,
          # target rows, unknown ids) is a setup failure, never a skip.
          ADMITTED_CAPABILITY_IDS = ("caps", "kernel", "lockdown", "lsm")

          rc = int(sys.argv[1])
          path = sys.argv[2]


          def emit(verdict, reason):
              line = "%s: %s" % (verdict, reason)
              print("DOCTOR-DISPOSITION: " + line)
              with open("doctor-disposition.txt", "w") as f:
                  f.write(line + "\n")
              if verdict in ("capable=true", "capable=false"):
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(verdict + "\n")


          def setup(reason):
              emit("setup-failure", reason)
              return 1


          def main():
              if rc not in (0, 4):
                  return setup("doctor exited %d, want 0 (capable) or 4 (fail-closed); abnormal termination is setup failure, never a capability skip" % rc)
              try:
                  with open(path) as f:
                      doc = json.load(f)
              except (OSError, ValueError) as e:
                  return setup("doctor report %s unreadable (%s)" % (path, e))
              if not isinstance(doc, dict):
                  return setup("doctor report is not a JSON object")
              verdict = doc.get("verdict")
              checks = doc.get("checks")
              if verdict not in ("ok", "fail-closed") or not isinstance(checks, list):
                  return setup("malformed doctor report (verdict=%r)" % (verdict,))
              fails = sorted(
                  (c.get("id") for c in checks if isinstance(c, dict) and c.get("status") == "fail"),
                  key=lambda v: str(v),
              )
              if "exit" in doc and doc["exit"] != rc:
                  return setup("doctor report exit %r disagrees with process status %d" % (doc["exit"], rc))
              if verdict == "ok":
                  if rc != 0 or fails:
                      return setup("inconsistent ok report (rc=%d, failing=%s)" % (rc, fails))
                  emit("capable=true", "verdict ok")
                  return 0
              if rc != 4:
                  return setup("inconsistent fail-closed report (rc=%d)" % rc)
              if not fails:
                  return setup("fail-closed verdict with no failing check")
              foreign = [i for i in fails if i not in ADMITTED_CAPABILITY_IDS]
              if foreign:
                  return setup("failing checks %s are not admitted capability absences (admitted: %s)" % (fails, list(ADMITTED_CAPABILITY_IDS)))
              emit("capable=false", "admitted capability absence: %s" % (fails,))
              return 0


          sys.exit(main())
          PYEOF
          # END DOCTOR-DISPOSITION
      - name: Bounded live check (known workload)
        id: capture
        if: steps.probe.outputs.capable == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          set -o pipefail
          PFX="${RUNNER_TEMP}/ossl-pfx"
          LIBCRYPTO="$(ldconfig -p 2>/dev/null | grep -m1 'libcrypto.so.3 ' | awk '{print $NF}')"
          test -n "$LIBCRYPTO" || { echo "no libcrypto.so.3 on lane; failing closed"; exit 4; }
          echo "libcrypto: $LIBCRYPTO" >lane-libcrypto.txt
          # Ledger evidence (F12): the workload's own stdout carries
          # LEDGER/ORDDONE into known-n-workload.log; observer
          # diagnostics stay in known-n-driver.log. The oracle reads
          # only this invocation's workload file, never observer
          # output or the earlier fixture smoke.
          set +e
          "$PFX/bin/osslscope" check \
            --provider "$LIBCRYPTO" --builtin \
            --object "$PFX/lib/osslscope/osslscope-harvest" \
            --count-object "$PFX/lib/osslscope/osslscope-count" \
            --deny-weak \
            --duration 30 --timeout 60 --grace 5 \
            --format json --out known-n.json \
            --workload-out known-n-workload.log \
            run -- "${RUNNER_TEMP}/ordinary_ops_driver" "$MODE" \
            >known-n-driver.log 2>&1
          rc=$?
          set -e
          cat known-n-driver.log
          echo "$rc" >check-exit.txt
          echo "check exit: $rc"
          case "$rc" in
            0|3|10|11) echo "exit $rc is a usable observation outcome; oracle decides" ;;
            *) echo "exit $rc is environment/usage failure, not an observation"; exit 1 ;;
          esac
      - name: Ledger oracle (independent counts)
        id: oracle
        if: steps.probe.outputs.capable == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          python3 scripts/live-oracle.py known-n-workload.log known-n.json "$MODE" >oracle.txt 2>&1
          rc=$?
          cat oracle.txt
          exit $rc
      - name: Upload live artifacts (pass, fail, or capability skip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-known-n-${{ steps.mode.outputs.mode }}
          path: |
            product-ref.txt
            kernel.txt
            invocation.txt
            doctor.json
            doctor.stderr
            doctor-rc.txt
            doctor-disposition.txt
            driver-smoke.txt
            lane-libcrypto.txt
            known-n-driver.log
            known-n-workload.log
            known-n.json
            check-exit.txt
            oracle.txt
          if-no-files-found: warn
      - name: Verdict summary (skip and setup failure are labeled, never a pass)
        if: always()
        run: |
          set -eu
          {
            echo "## live-known-n verdict"
            echo ""
            echo "- product: $(cat product-ref.txt 2>/dev/null || echo unknown)"
            echo "- kernel: $(cat kernel.txt 2>/dev/null || echo unknown)"
            if [ "${{ steps.probe.outcome }}" != "success" ]; then
              echo "- SETUP FAILURE: an earlier step failed before or during the capability probe;"
              echo "  no capture was attempted and no observation is claimed."
              if [ -f doctor-disposition.txt ]; then
                echo "- disposition: $(cat doctor-disposition.txt)"
              fi
            elif [ "${{ steps.probe.outputs.capable }}" = "true" ]; then
              echo "- doctor: verdict ok (live capability present)"
              echo "- check exit: $(cat check-exit.txt 2>/dev/null || echo unknown)"
              if grep -q 'ORACLE PASS' oracle.txt 2>/dev/null; then
                echo "- oracle: PASS (ledgered execution visible)"
              elif grep -q 'ORACLE SKIP' oracle.txt 2>/dev/null; then
                echo "- oracle: SKIP (version-gated fixture; nothing asserted)"
              else
                echo "- oracle: FAIL (see oracle.txt artifact)"
              fi
            else
              echo "- SKIP(live-capability): admitted capability absence on this runner;"
              echo "  no capture was attempted and no observation is claimed."
              echo "  (a skip is not a passing qualification window)"
              if [ -f doctor-disposition.txt ]; then
                echo "- disposition: $(cat doctor-disposition.txt)"
              fi
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.probe.outcome }}" != "success" ]; then
            echo "SETUP FAILURE before or during probe; see summary"
            exit 1
          elif [ "${{ steps.probe.outputs.capable }}" != "true" ]; then
            echo "SKIP(live-capability): no live observation; see summary"
          elif grep -q 'ORACLE PASS\|ORACLE SKIP' oracle.txt 2>/dev/null; then
            echo "oracle accepted (PASS or version-gated SKIP); see summary"
          else
            exit 1
          fi
