name: image

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the Dockerfile's install receipt binds to the
          # committed source identity (same fidelity as release.yml).
          fetch-depth: 0

      - name: Resolve image tag
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            tag="${REF_NAME#v}"
            if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::refusing to push image tag for non-version tag: $REF_NAME"
              exit 1
            fi
          else
            tag="pr-$PR_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # Pull requests build only; version tags build and push.
          push: ${{ github.ref_type == 'tag' }}
          tags: ghcr.io/mingulov/osslscope:${{ steps.meta.outputs.tag }}
          # 0.x ships no attestations (checksums unsigned, no SBOM):
          # keep the image free of provenance/SBOM attachments.
          provenance: false
          sbom: false
