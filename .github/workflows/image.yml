name: image

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and push (e.g. v0.6.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  # Sigstore signing for tag provenance attestations: registry
  # provenance rides the push, and the API entry below makes
  # plain `gh attestation verify oci://...` work (verify with
  # `gh attestation verify
  # oci://ghcr.io/mingulov/osslscope:<tag> --owner mingulov`).
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the Dockerfile's install receipt binds to the
          # committed source identity (same fidelity as release.yml).
          # Dispatch builds the named tag's source with this tree's recipe.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve image tag
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          push=false
          if [[ -n "$INPUT_TAG" ]]; then
            ref_name="$INPUT_TAG"
          else
            ref_name="$REF_NAME"
            [[ "$REF_TYPE" == "tag" ]] && push=true
          fi
          if [[ "$push" == "true" || -n "$INPUT_TAG" ]]; then
            tag="${ref_name#v}"
            if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::refusing to push image tag for non-version tag: $ref_name"
              exit 1
            fi
            push=true
          else
            tag="pr-$PR_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Build image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # Pull requests build only; version tags (and tag
          # dispatches) build and push.
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ghcr.io/mingulov/osslscope:${{ steps.meta.outputs.tag }}
          # Pushed images ship SLSA provenance attestations
          # alongside the image (no SBOM in 0.x); PR builds
          # stay bare.
          provenance: ${{ steps.meta.outputs.push == 'true' }}
          sbom: false

      - name: Attest image provenance
        if: steps.meta.outputs.push == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/mingulov/osslscope
          subject-digest: ${{ steps.build.outputs.digest }}
